[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mozo"
dynamic = ["version"]
description = "Universal computer vision model serving library with dynamic model management and PixelFlow integration"
readme = "README.md"
authors = [
    { name = "Emrah NAZIF", email = "emrah@datamarkin.com" },
    {name = "Datamarkin", email = "support@datamarkin.com"}
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "opencv-python-headless",
    "transformers",
    "torch",
    "Pillow",
    "numpy",
    "pixelflow",
    "click",
]

# Optional, per-family dependencies. Adapters raise ImportError with install
# instructions when their framework is missing, so the core install stays light.
# detectron2 is deliberately absent: it has no pip release and must be installed
# per platform (https://detectron2.readthedocs.io/en/latest/tutorials/install.html).
[project.optional-dependencies]
paddleocr = ["paddleocr>=3.0.0"]
easyocr = ["easyocr"]
test = ["requests"]  # tests/smoke_test.py drives the server over HTTP

[project.scripts]
mozo = "mozo.cli:cli"

[project.urls]
"Homepage" = "https://github.com/datamarkin/mozo"
"Bug Tracker" = "https://github.com/datamarkin/mozo/issues"

[tool.setuptools.packages.find]
include = ["mozo*"]

# Version lives in mozo/__init__.py — single source of truth.
[tool.setuptools.dynamic]
version = { attr = "mozo.__version__" }

# Ship the test UI and its example image; /test-ui and /static/example.jpg
# return errors without them (they were missing from the 0.4.0 wheel).
[tool.setuptools.package-data]
mozo = ["static/*", "manifest.json"]
# Vendored architectures carry data files their code reads at build time
"mozo.vendors.rfdetr_deploy.models.backbone" = ["dinov2_configs/*.json"]
# The vendored code is redistributed under its own terms, so its licence and provenance travel
# in the wheel with it -- the same rule the weights follow.
"mozo.vendors.rfdetr_deploy" = ["LICENSE", "NOTICE", "PROVENANCE.md"]
