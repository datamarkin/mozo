[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mozo"
dynamic = ["version"]
# The line PyPI puts in its search results and at the top of the project page. It states no
# count: this string is baked into every wheel at build time, so a number here would be right
# on the day of the release and wrong on every page of it afterwards.
description = "Run several computer vision models or a graph of them from one pip install, with the original's exact numbers."
readme = "README.md"
authors = [
    { name = "Emrah NAZIF", email = "emrah@datamarkin.com" },
    {name = "Datamarkin", email = "support@datamarkin.com"}
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# What someone searching PyPI would type. Tasks first, because that is what a person looks for;
# then the families and runtimes, because that is what they look for once they know what exists.
keywords = [
    "computer-vision", "object-detection", "instance-segmentation", "image-segmentation",
    "depth-estimation", "ocr", "zero-shot-classification", "embeddings", "image-recognition",
    "inference", "model-serving", "model-zoo", "workflow",
    "pytorch", "onnx", "coreml", "yolo", "clip", "sam", "rf-detr", "fastapi",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn",
    "opencv-python-headless",
    "torch",
    "Pillow",
    "numpy",
    # 0.2.0 is where ``Detection.text`` and ``from_arrays(texts=, segments=)`` landed. The
    # EasyOCR adapter needs both: a read string is not a class name, and a text quadrilateral
    # flattened to a box loses the orientation that made it worth keeping.
    "pixelflow",
    "click",
    # FastAPI needs this to accept the multipart upload every /predict endpoint takes. Without
    # it mozo.server raises at import, not at request time -- so it was never optional.
    "python-multipart",
    # SAM 3 and OWLv2 tokenize prompts with CLIP's byte-pair encoder. ``regex`` is not optional for
    # correctness -- the split pattern uses Unicode categories (\p{L}, \p{N}) that the standard
    # library's ``re`` cannot express -- and ``ftfy`` repairs mis-decoded input the way upstream
    # does. Both declare no version bounds and pull in nothing but ``wcwidth``, so neither adds
    # any resolver pressure.
    "regex",
    "ftfy",
    # Already a de-facto dependency: rfdetr_deploy and depth_anything_v2_deploy import it at
    # module scope, and SAM 3's exemplar-box pooling needs ``roi_align``. Declared so a missing
    # install fails at install time rather than inside a forward pass.
    "torchvision",
]

# Optional runtimes. Every model family ships as a vendored, deployment-only extraction, so
# no family needs its upstream package installed -- the only extras are alternative ways to
# execute the same graph.
[project.optional-dependencies]
# Runtimes beyond torch. Without these, `auto` simply does not select their artifacts; asking
# for one by name raises with the install command.
onnx = ["onnxruntime"]
coreml = ["coremltools>=8.0,<10.0"]  # macOS only; the fastest RF-DETR path on Apple silicon

test = ["httpx"]  # fastapi's TestClient drives the endpoints in tests/test_server_responses.py

[project.scripts]
mozo = "mozo.cli:cli"

[project.urls]
"Homepage" = "https://github.com/datamarkin/mozo"
"Documentation" = "https://github.com/datamarkin/mozo/blob/main/docs/README.md"
"Release Notes" = "https://github.com/datamarkin/mozo/releases"
"Bug Tracker" = "https://github.com/datamarkin/mozo/issues"

[tool.setuptools.packages.find]
include = ["mozo*"]

# Version lives in mozo/__init__.py — single source of truth.
[tool.setuptools.dynamic]
version = { attr = "mozo.__version__" }

# Ship the test UI and its example image; /test-ui and /static/example.jpg
# return errors without them (they were missing from the 0.4.0 wheel).
[tool.setuptools.package-data]
mozo = ["static/*", "manifest.json", "workflow/static/*", "workflow/static/assets/*"]

# Every vendored extraction is redistributed under its own terms, so its licence, its NOTICE and
# its provenance travel in the wheel with it -- the same rule the weights follow. Any asset its
# code reads at import or construction time ships too: a tokenizer that needs a network round trip
# before it can encode a prompt is not a tokenizer that works offline.
#
# One rule over every package rather than one line per family, and that is the whole point. This
# was a hand-written list of eight entries and it had gone stale for five of the fourteen families
# -- siglip2 and all four YOLOs shipped their code with none of their terms, which is precisely
# the failure two of the entries were added late to fix. A list that must be extended by hand for
# each new family will be forgotten again; a rule that applies to all of them cannot be.
"*" = ["LICENSE", "NOTICE", "PROVENANCE.md", "assets/*"]

# Data a package's code reads that is not covered by the convention above.
"mozo.vendors.rfdetr_deploy.models.backbone" = ["dinov2_configs/*.json"]
